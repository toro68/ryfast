[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
  ".venv",
  "venv",
  "env",
  "myenv",
]

# BLE001 (bred except) tillates kun der en delfeil ikke skal velte helheten:
# graf-/figurinnsetting i eksport, altair-vakter i UI, og session_state-flush i api.py.
[tool.ruff.lint.per-file-ignores]
"ryfast_app/api.py" = ["BLE001"]
"ryfast_app/exports/*.py" = ["BLE001"]
"ryfast_app/ui/*.py" = ["BLE001"]
"scripts/*.py" = ["BLE001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
